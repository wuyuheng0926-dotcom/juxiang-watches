<!doctype html><meta charset="utf-8"><base href="../"><title>JUXIANG visual index builder</title><button id="start">Build index from current catalogue</button><pre id="progress"></pre><script src="catalog.js"></script><script src="../visual-search-engine.js"></script><script>document.getElementById("start").onclick=async()=>{const button=document.getElementById("start");button.disabled=true;try{const entries=products.flatMap(p=>p.variants.filter(v=>!v.catalogHidden).map(v=>({id:p.id,color:v.key,image:v.image,panel:v.imagePanel})));const rows=[];await JXVision.load();for(const e of entries){const img=new Image();img.src="assets/"+e.image+".jpg";await img.decode();const f=await JXVision.extract(img,e.panel);rows.push({id:e.id,color:e.color,image:e.image,vectors:f.vectors.map(JXVision.pack)});document.getElementById("progress").textContent=rows.length+" / "+entries.length;await new Promise(r=>setTimeout(r,0))}const data={version:1,model:"mobilenet-v1-1.0-224",dimensions:1024,rows};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="visual-index-20261114.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){document.getElementById("progress").textContent=String(e)}finally{button.disabled=false}};</script>
