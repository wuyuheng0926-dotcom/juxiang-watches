<!doctype html><meta charset="utf-8"><base href="../"><title>JUXIANG visual index builder</title><button id="start">Build index from current catalogue</button><pre id="progress"></pre><script src="catalog.js"></script><script src="../visual-search-engine.js"></script><script>document.getElementById("start").onclick=async()=>{const button=document.getElementById("start");button.disabled=true;try{const entries=products.flatMap(p=>p.variants.filter(v=>!v.catalogHidden).map(v=>({id:p.id,color:v.key,image:v.image,panel:v.imagePanel})));const rows=[],quickRows=[];await JXVision.load();for(const e of entries){const img=new Image();img.src="assets/"+e.image+".jpg";await img.decode();const f=await JXVision.extract(img,e.panel);rows.push({id:e.id,color:e.color,image:e.image,vectors:f.vectors.map(JXVision.pack)});quickRows.push({id:e.id,color:e.color,views:JXVision.quickExtract(img,e.panel).map(JXVision.quickPack)});document.getElementById("progress").textContent=rows.length+" / "+entries.length;await new Promise(r=>setTimeout(r,0))}const data={version:1,model:"mobilenet-v1-1.0-224",dimensions:1024,rows};for(const [name,text,type] of [["visual-index-20261114.json",JSON.stringify(data),"application/json"],["visual-quick-index-20261114.js","window.JXQuickIndex="+JSON.stringify(quickRows)+";","text/javascript"]]){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.textContent="Download "+name;a.style.display="block";document.body.append(a)}}catch(e){document.getElementById("progress").textContent=String(e)}finally{button.disabled=false}};</script>
